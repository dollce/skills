name: Validate skills

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install validation dependency
        run: python -m pip install -r spl/requirements-dev.txt
      - name: Check local links, skill metadata and portable archives
        run: make check
      - name: Install skills in a temporary project with the supported CLI
        run: make check-cli
